name: Travella Deployment
on:
  push:
    branches: [ "main" ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install 

      - name: Build Project
        run: CI=false npm run build 
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Deploy to Firebase
        # Updated with your specific project ID
        run: npx firebase-tools deploy --only hosting --project travella-f5876 --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive